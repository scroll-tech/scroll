version: "2"
run:
  concurrency: 4
  # Paths in exclusion rules are relative to the module directory that build/lint.go runs in.
  relative-path-mode: wd
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - bidichk
    - bodyclose
    - depguard
    - durationcheck
    - forbidigo
    - goconst
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
          deny:
            - pkg: github.com/davecgh/go-spew/spew
    dupl:
      threshold: 100
    forbidigo:
      # The SDK hashes headers with Scroll L2 rules, so it computes wrong hashes for L1 blocks.
      # For L1 blocks, read "hash" from the eth_getBlockByNumber response instead.
      # For L2 blocks, the SDK hash is correct: add `//nolint:forbidigo // L2 block`,
      # or list an L2-only file under linters.exclusions.rules.
      forbid:
        - pattern: ^types\.(Header|Block)\.Hash$
          pkg: ^github\.com/scroll-tech/go-ethereum/core/types$
          msg: wrong for L1 blocks; use the RPC-reported hash (see build/.golangci.yml)
      analyze-types: true
    errcheck:
      check-type-assertions: false
      check-blank: false
    goconst:
      min-len: 3
      min-occurrences: 3
      exclude-types:
        # v1 parity: newer goconst also flags composite literals
        - Call
        - CompositeLit
    gocritic:
      disabled-checks:
        - regexpMust
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 40
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
      ignore-rules:
        - gossamer
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
    govet:
      enable:
        - shadow
    staticcheck:
      checks:
        # v1 parity: stylecheck (ST) and quickfix (QF) were not enabled before v2
        - all
        - -ST*
        - -QF*
    gosec:
      excludes:
        # G115 and G118 arrived after golangci-lint v1.57; triage separately
        - G115
        - G118
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - errcheck
          - golint
          - gosec
        path: backend_abi\.go
      # These files only hash L2 blocks, where the SDK hash is correct (see forbidigo above).
      - linters:
          - forbidigo
        path: (^|/)(orm/(chunk|l2_block)|l2_(watcher|relayer))\.go$
      - linters:
          - forbidigo
        path: ^tests/
      - linters:
          - staticcheck
        text: 'SA9003:'
      - linters:
          - lll
        text: long-lines
        source: '^//go:generate '
      - linters:
          - gosec
        text: G108
      - linters:
          - wsl
        text: return statements should not be cuddled if block has more than two lines
      - linters:
          - wsl
        text: branch statements should not be cuddled if block has more than two lines
      - linters:
          - wsl
        text: declarations should never be cuddled
      - linters:
          - wsl
        text: expressions should not be cuddled with declarations or returns
      - linters:
          - govet
        text: 'shadow: declaration of "(err|ctx)" shadows declaration at'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
